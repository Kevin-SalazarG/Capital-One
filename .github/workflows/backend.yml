name: Workspace quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PG_BIN: /usr/lib/postgresql/17/bin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout the pinned Nessie SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Kevin-SalazarG/nessie-node-sdk
          ref: 7d57c894c5b45eb38d3c817830f79c73f6ce27cf
          path: nessie-node-sdk
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.1.3
          run_install: false
      - name: Install PostgreSQL 17 from the signed project repository
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          printf '%s\n' 'deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main' | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-17
          "$PG_BIN/postgres" --version
      - name: Install the frozen workspace
        run: pnpm install --frozen-lockfile
      - name: Validate contribution metadata
        run: node --import tsx scripts/check-git-policy.ts
      - name: Run backend and mobile static, test, and bundle checks
        run: pnpm check
      - name: Build the production image
        run: docker build --file apps/api/Dockerfile --tag mirror-api:ci .
      - name: Verify the container against isolated PostgreSQL
        env:
          TEST_CONTAINER_IMAGE: mirror-api:ci
        run: node --import tsx scripts/smoke-container.ts
